name: build-singlefile

# 没有本地 VS 也能拿到 exe：推到 GitHub 后跑这个工作流，
# 从 Actions 页面的 Artifacts 里下载 WingetManager-singlefile。
#
# 打 v* 标签（如 v2.18.0-wpf）会额外跑 release job，把本次构建出的 exe
# 连同 SHA256SUMS.txt 一起发成 GitHub Release——release 由仓库自己的
# GITHUB_TOKEN 创建，不需要本地任何凭据。
#
# 发一版的完整动作：
#   1. 写 docs/releases/<tag>.md，首行 `# 标题`（标题），其余为正文
#   2. git tag -a <tag> -m "一句话说明"      # 标签说明给人看，不参与发版
#   3. git push origin <tag>
# 同一个 tag 重推是幂等的：旧 release（连同资产）会被删掉重建。

on:
  push:
    # wpf-rewrite 是本实现所在的分支（master 是 Python 原版）
    branches: [main, master, wpf-rewrite]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 先跑逻辑层自测：445 条断言，退出码非 0 直接让工作流红掉，
      # 避免带着回归产出 exe。注意 windows-latest 是 en-US 系统
      # （ANSI = 1252），凡是依赖区域设置的解码分支只有在这里才测得到。
      - name: Run self-test
        shell: cmd
        run: tests\SelfTest\build-and-run.bat

      - name: Build single-file exe
        shell: cmd
        run: build-release.bat

      - name: Show artifact info
        shell: cmd
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WingetManager-singlefile
          path: dist/WingetManager.exe
          if-no-files-found: error

  release:
    # 只有打 tag 才发版；普通 push 到分支只跑 build。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    # 默认 token 是只读的，建 release 必须显式提权到这个 job。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: WingetManager-singlefile
          path: artifact

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="WingetManager-${tag#v}.exe"
          mkdir -p out
          cp artifact/WingetManager.exe "out/$asset"
          cd out
          # coreutils 对二进制文件输出 "hash *name"，统一成 "hash  name" 更通用
          sha256sum "$asset" | sed 's/ \*/  /' > SHA256SUMS.txt
          echo "--- 待上传 ---"
          ls -l
          cat SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"

          # 标题和正文都从说明文件取。**不要**用 `git tag -l --format=%(contents:subject)`：
          # actions/checkout 检出 tag 时会把附注标签退化成轻量 ref，`contents`
          # 于是回落到 commit message，release 标题会变成一句提交信息。
          title="$tag"
          body="$RUNNER_TEMP/release-notes.md"
          if [ -f "$notes" ]; then
            # 工作区按 .gitattributes 检出成 CRLF，先归一成 LF，
            # 否则标题会带一个尾随 \r，空行判断也会失灵。
            norm="$RUNNER_TEMP/notes.lf.md"
            tr -d '\r' < "$notes" > "$norm"
            # 约定：文件首行 `# 标题` 即 release 标题，其余为正文
            title="$(sed -n '1s/^#[[:space:]]*//p' "$norm")"
            [ -n "$title" ] || title="$tag"
            awk 'NR==1{next} NR==2 && $0==""{next} {print}' "$norm" > "$body"
          else
            echo "::warning::$notes 不存在，改用自动生成的 release notes"
            body=""
          fi

          # 幂等：重推同一个 tag 时先删掉旧 release（保留 tag），否则 create 会报 already exists
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag 已存在，先删除再重建"
            gh release delete "$tag" --yes --cleanup-tag=false
          fi

          if [ -n "$body" ]; then
            gh release create "$tag" out/* --verify-tag --title "$title" \
              --notes-file "$body" --latest=false
          else
            gh release create "$tag" out/* --verify-tag --title "$title" \
              --generate-notes --latest=false
          fi
