name: build-singlefile

# 没有本地 VS 也能拿到 exe：推到 GitHub 后跑这个工作流，
# 从 Actions 页面的 Artifacts 里下载 WingetManager-singlefile。
#
# 打 v* 标签（如 v2.18.0-wpf）会额外跑 release job，把本次构建出的 exe
# 连同 SHA256SUMS.txt 一起发成 GitHub Release——release 由仓库自己的
# GITHUB_TOKEN 创建，不需要本地任何凭据。
#
# 发一版的完整动作：
#   git tag -a v2.18.0-wpf -m "标题第一行就是 release 标题"
#   git push origin v2.18.0-wpf
#   （说明正文放 docs/releases/<tag>.md，没有则退回 GitHub 自动生成的 release notes）

on:
  push:
    # wpf-rewrite 是本实现所在的分支（master 是 Python 原版）
    branches: [main, master, wpf-rewrite]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 先跑逻辑层自测：432 条断言，退出码非 0 直接让工作流红掉，
      # 避免带着回归产出 exe。注意 windows-latest 是 en-US 系统
      # （ANSI = 1252），凡是依赖区域设置的解码分支只有在这里才测得到。
      - name: Run self-test
        shell: cmd
        run: tests\SelfTest\build-and-run.bat

      - name: Build single-file exe
        shell: cmd
        run: build-release.bat

      - name: Show artifact info
        shell: cmd
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WingetManager-singlefile
          path: dist/WingetManager.exe
          if-no-files-found: error

  release:
    # 只有打 tag 才发版；普通 push 到分支只跑 build。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    # 默认 token 是只读的，建 release 必须显式提权到这个 job。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 对象本身（附注标签的标题行当 release 标题用）
          fetch-depth: 0

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: WingetManager-singlefile
          path: artifact

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="WingetManager-${tag#v}.exe"
          mkdir -p out
          cp artifact/WingetManager.exe "out/$asset"
          cd out
          sha256sum "$asset" > SHA256SUMS.txt
          echo "--- 待上传 ---"
          ls -l
          cat SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="$(git tag -l --format='%(contents:subject)' "$tag")"
          [ -n "$title" ] || title="$tag"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" out/* --verify-tag --title "$title" \
              --notes-file "$notes" --latest=false
          else
            echo "::warning::$notes 不存在，改用自动生成的 release notes"
            gh release create "$tag" out/* --verify-tag --title "$title" \
              --generate-notes --latest=false
          fi
